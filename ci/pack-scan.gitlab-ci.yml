# pack-scan.gitlab-ci.yml
#
# GitLab CI include template for scanning an OPF pack.
#
# Usage: in your pack's .gitlab-ci.yml:
#
#   include:
#     - project: 'your-group/opf-core'
#       file: '/ci/pack-scan.gitlab-ci.yml'
#
# Or copy this file into your pack's .gitlab-ci.yml.
#
# The opf-core repo (which provides the validator) is cloned from
# OPF_CORE_REPO (default https://github.com/rlnorthcutt/opf-core.git).
# The validator step always runs; a missing validator is a hard failure.
#
# This job installs shellcheck, semgrep, and gitleaks itself rather than
# skipping them when absent: this CI include is meant to be the canonical,
# single-sourced security gate every pack inherits (host-layout doc, "opf-core
# scan profile"), so it should not silently run structural validation only.
# Runners that already provide these tools can drop the install steps.
# The image is glibc-based (not alpine) because semgrep's published wheels
# are manylinux (glibc) only and are unreliable on musl libc.
# Pinned versions below should be bumped periodically.

stages:
  - scan

pack-scan:
  stage: scan
  image: python:3.12-slim
  variables:
    OPF_CORE_REPO: "https://github.com/rlnorthcutt/opf-core.git"
    SHELLCHECK_VERSION: "0.10.0"
    GITLEAKS_VERSION: "8.21.2"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates >/dev/null
    - git clone --depth 1 "$OPF_CORE_REPO" opf-core
    - pip install --disable-pip-version-check --quiet jsonschema semgrep
    - curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ -f - -C /usr/local/bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
    - chmod +x /usr/local/bin/shellcheck
    - curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -f - -C /usr/local/bin gitleaks
    - chmod +x /usr/local/bin/gitleaks
  script:
    - bash opf-core/scripts/validate-pack.sh .
    - |
      sh_files="$(find . -maxdepth 2 -name '*.sh' -not -path './opf-core/*')"
      if [ -n "$sh_files" ]; then echo "$sh_files" | xargs shellcheck; else echo "no shell scripts found; skipping shellcheck"; fi
    - semgrep scan --config auto .
    - gitleaks detect --source . --no-banner