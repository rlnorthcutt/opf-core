name: opf-pack-scan

# This job installs semgrep and gitleaks itself rather than skipping them
# when absent: this reusable workflow is meant to be the canonical,
# single-sourced security gate every pack inherits (host-layout doc,
# "opf-core scan profile"), so it should not silently run structural
# validation only. shellcheck ships preinstalled on GitHub-hosted
# ubuntu-latest runners, but the install script still checks for it.
# The actual install logic lives in opf-core/scripts/ci-install-scanners.sh,
# shared with ci/pack-scan.gitlab-ci.yml, so the two templates cannot
# silently drift to different tool versions or different install behavior.

on:
  workflow_call:
    inputs:
      opf-core-repo:
        description: 'Repository to fetch opf-core (validator) from.'
        required: false
        type: string
        default: 'rlnorthcutt/opf-core'

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.10.0"
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - name: Checkout pack
        uses: actions/checkout@v4

      - name: Checkout opf-core (validator)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.opf-core-repo }}
          path: opf-core

      - name: Validate pack
        run: bash opf-core/scripts/validate-pack.sh .

      - name: Install scanners
        run: bash opf-core/scripts/ci-install-scanners.sh

      - name: Shellcheck
        run: |
          sh_files="$(find . -name '*.sh' -not -path './opf-core/*' -not -path './data/*' -not -path './.git/*')"
          if [ -n "$sh_files" ]; then echo "$sh_files" | xargs shellcheck; else echo "no shell scripts found; skipping shellcheck"; fi

      - name: Semgrep
        run: semgrep scan --config auto .

      - name: Gitleaks
        run: gitleaks detect --source . --no-banner