name: opf-pack-scan

on:
  workflow_call:
    inputs:
      opf-core-repo:
        description: 'Repository to fetch opf-core (validator) from.'
        required: false
        type: string
        default: 'rlnorthcutt/opf-core'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pack
        uses: actions/checkout@v4

      - name: Checkout opf-core (validator)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.opf-core-repo }}
          path: opf-core

      - name: Validate pack
        run: |
          bash opf-core/scripts/validate-pack.sh .

      - name: Shellcheck (if installed)
        continue-on-error: false
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/*.sh
          else
            echo "shellcheck not installed; skipping."
          fi

      - name: Semgrep (if installed)
        continue-on-error: false
        run: |
          if command -v semgrep >/dev/null 2>&1; then
            semgrep scan --config auto .
          else
            echo "semgrep not installed; skipping."
          fi

      - name: Gitleaks (if installed)
        continue-on-error: false
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --no-banner
          else
            echo "gitleaks not installed; skipping."
          fi